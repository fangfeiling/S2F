# E2-CSTP Configuration for Washington, D.C. (DC) Dataset

[Paths]
image_dir = ../data/DC/RS/
text_dir = ../data/DC/POI_TO_TEXT/
taxi_flow_path = ../data/DC/TAXI/flow.csv
geo_path = ../data/DC/geo.csv
save_dir_stage1 = ./checkpoints/DC/
log_dir = ./logs/DC/
result_dir = ./results/DC/

[Data]
data = DC_TAXI
num_nodes = 237
train_ratio = 0.8
val_ratio = 0.1
start_time = 2019-01-01 00:00:00

[Model]
his_len = 12
pred_len = 12
d_model = 64
num_heads = 8
backbone_layers = 3
num_clusters = 3
num_experts = 8
hidden_dim = 128
feature_dim = 32
prompt_dim = 128
image_token_count = 8
use_remoteclip = True
remoteclip_model = ViT-B-32
use_glam = True
glam_knn_k = 8
prototype_tau = 0.2
use_prototype_router = True
dropout = 0.25
mask_flow_input = True

[Training]
batch_size = 1
epochs = 50
lr = 0.0001
weight_decay = 0.001
lambda_bal = 0.01

lambda_pred = 2.0
lambda_amp = 0.0
lambda_scale = 0.0
lambda_msle = 5.0
lambda_rank = 0.1
lambda_tcl = 0.1
lambda_orth = 0.05
contrastive_tau = 0.2
orth_eps = 1e-6

rank_margin = 0.05
scale_epsilon = 1.0
grad_clip = 1.0
optimizer = AdamW
scheduler = CosineAnnealingLR
warmup_epochs = 5
cosine_tmax_multiplier = 1.5
primary_metric = rmsle
composite_amp_weight = 1.0
save_interval = 100
val_interval = 5
log_interval = 100

[System]
device = cuda:0
num_workers = 4
seed = 42